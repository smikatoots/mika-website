# Exports Notion blog DB → content/blog/*.mdx + manifest.json, then commits.
# Add repo secrets: NOTION_API_KEY, NOTION_BLOG_DATABASE_ID (and any NOTION_PROPERTY_* overrides).
name: Sync Notion blog

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC — adjust as needed

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run sync:blog
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_BLOG_DATABASE_ID: ${{ secrets.NOTION_BLOG_DATABASE_ID }}
          NOTION_PROPERTY_TITLE: ${{ vars.NOTION_PROPERTY_TITLE }}
          NOTION_PROPERTY_SLUG: ${{ vars.NOTION_PROPERTY_SLUG }}
          NOTION_PROPERTY_PUBLISHED: ${{ vars.NOTION_PROPERTY_PUBLISHED }}
          NOTION_PROPERTY_ROUTE: ${{ vars.NOTION_PROPERTY_ROUTE }}
          NOTION_PROPERTY_PATH: ${{ vars.NOTION_PROPERTY_PATH }}
          NOTION_PROPERTY_TAGS: ${{ vars.NOTION_PROPERTY_TAGS }}

      - name: Commit MDX if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blog
          git diff --staged --quiet || (git commit -m "chore: sync blog from Notion" && git push)
