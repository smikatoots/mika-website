name: IndexNow

# Runs after Vercel reports a successful production deploy, and pings IndexNow
# with the sitemap URLs that are new or changed since the last run.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      submit_all:
        description: "Submit every sitemap URL (first-time seeding only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore last sitemap snapshot
        uses: actions/cache/restore@v4
        with:
          path: .indexnow-snapshot.json
          key: indexnow-snapshot-${{ github.run_id }}
          restore-keys: indexnow-snapshot-

      # Give the production alias a moment to point at the new deployment.
      - name: Wait for production alias
        if: github.event_name == 'deployment_status'
        run: sleep 30

      - name: Submit changed URLs
        run: node scripts/indexnow-submit.mjs ${{ inputs.submit_all && '--all' || '' }}

      - name: Save sitemap snapshot
        uses: actions/cache/save@v4
        with:
          path: .indexnow-snapshot.json
          key: indexnow-snapshot-${{ github.run_id }}
